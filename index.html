
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Store</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

header{
    background:#1a73e8;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.search{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-bottom:20px;
    box-sizing:border-box;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    gap:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card img{
    width:80px;
    height:80px;
    border-radius:15px;
}

.info{
    flex:1;
}

.download{
    background:#1a73e8;
    color:white;
    padding:10px 15px;
    text-decoration:none;
    border-radius:8px;
}

.version{
    color:gray;
    font-size:14px;
}
</style>
</head>
<body>

<header>
    <h2>My App Store</h2>
</header>

<div class="container">

<input type="text"
       class="search"
       placeholder="Search App...">

<div class="card">

<img src="https://via.placeholder.com/80">

<div class="info">
<h3>Paisa Bachao</h3>
<p>Track your daily expenses easily.</p>
<p class="version">Version 1.0.0</p>
</div>

<a class="download"
href="https://github.com/abdurrakib11996-lgtm/app-store/releases/download/v1.0.0/app-release.apk">
Download
</a>

</div>

</div>

</body>
</html>

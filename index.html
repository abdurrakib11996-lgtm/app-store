<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR App Store</title>
    <style>
        .app-header{
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .app-header2{
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .app-title-block{
            margin-left:0%;
        }
        .app-title-block2{
            margin-left: 0%;
        }

        .card{
            border: 1px solid #ccc;
            padding: 15px;
            border-radius: 8px;
        width: 300px        }

.card{
    border: 1px solid #ccc;
    padding: 15px;
    border-radius: 8px;
    width: 300px;
    
  
}

    </style>
   
</head>
<body>

    <header>  <h1>AR App Store</h1></header>

    
    <div class="container">
        <input type="text"
        class="search-box" placeholder="Search App..." onkeyup="filterApps()">
      

        <br>
        <br>

   <div class="card" onclick="window.location.href='paisabachao.html'">  
 <div class="app-header">

 <img  style="width: 70px; height:auto" src="bhandar.png" alt="Paisa Bachao Logo">

 <div class="app-title-block">
    <h3>Paisa Bachao</h3>
 </div>
   </div>
    </div>

   <br>

    <div class="card" onclick="window.location.href='psc.html'">
        <div class="app-header2">
            <img style="width: 60px; height:auto" src="psc.image.png" alt="PSC LOGO">
            <div class="app-title-block2">
             <h3 >PSC-Pathan Study Center</h3>
            </div>

        </div>
         </div>  
   </div>

<script>
    function filterApps(){
        let filter = document.querySelector('.search-box').value.toLowerCase();
        let apps = document.getElementsByClassName('card')
        for(let i=0; i<apps.length; i++){
            let appTitle =apps[i].querySelector('h3').innerText.toLowerCase();
            if(appTitle.includes(filter)){
                apps[i].style.display = "";
                        
        }else{
            apps[i].style.display ="none";
        }
    }
    }
</script>


</body>
</html>
